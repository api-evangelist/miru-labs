aid: miru-labs
name: Miru Labs
description: >-
  Miru Labs is a San Francisco / Bay Area cybersecurity startup founded in 2024 by
  Eoghan McKee, Quang Pham, and David Pigott, building a graph-native investigation and
  insider-threat prevention platform. Miru unifies cloud and endpoint sources into a living
  graph so human analysts and AI agents can investigate together, using behavioral
  intelligence to distinguish malicious intent from accidental violations and an "Agentic
  Dispatch" capability that runs autonomous investigations that triage, escalate, and
  counter-act across alerts and domains. The platform targets cybersecurity, trust and
  safety, and national-security investigation use cases, detecting AI leakage, data
  exfiltration, privilege escalation, reconnaissance, and espionage, and generating
  legal-grade case reports. The company raised a $2.7M pre-seed round led by Dreamcraft and
  Cadenza alongside Seedcamp, with participation from Inovia, Notion, and Alphagraph. It was
  added to the API Evangelist network as a Seedcamp portfolio lead; as of this pass Miru
  publishes no public API, developer portal, documentation, or GitHub organization.
